name = "workerpn"
main = "src/index.js"
compatibility_date = "2024-09-23"

# لازم برای استفاده از TCP Sockets API (`cloudflare:sockets`) که ریلی VLESS
# برای اتصال خروجی به مقصد ازش استفاده می‌کنه.
# https://developers.cloudflare.com/workers/runtime-apis/tcp-sockets/

[[durable_objects.bindings]]
name = "STORE"
class_name = "ChopStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChopStore"]

# همه‌ی مقادیر زیر را با `wrangler secret put <NAME>` ست کنید تا در
# ریپازیتوری/گیت ذخیره نشوند (اگر ADMIN_USER ست نشه، پیش‌فرض کد "admin" است):
#   ADMIN_USER, ADMIN_PASS, SESSION_SECRET
# PUBLIC_HOST اختیاری است (پیش‌فرض: هاست همان دامنه‌ای که Worker رویش صدا زده می‌شود)
# و اگر لازم شد می‌شه به‌صورت [vars] عادی (نه secret) اضافه‌اش کرد.
